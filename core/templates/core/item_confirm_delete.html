{% extends 'base.html' %}
{% block title %}Delete Record{% endblock %}
{% block content %}
<h2>Delete Record</h2>
<p>Are you sure you want to delete "{{ item.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'item_list' %}">Cancel</a>
{% endblock %}
